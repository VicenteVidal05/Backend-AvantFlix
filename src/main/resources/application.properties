spring.application.name=avantflix-backend

# 1. Conexión a MySQL en XAMPP (por defecto usuario root y contraseña vacía)
spring.datasource.url=jdbc:mysql://localhost:3306/avantflix_db?serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# 2. Protección y mapeo exacto de tu esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 3. Ver las consultas SQL reales en consola mientras aprendes
spring.jpa.show-sql=true